# ========================================================
# Server Configuration
# ========================================================
server.port=8080

# ========================================================
# MySQL Database Configuration (Cloud-Ready with Local Defaults)
# ========================================================
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/canteen_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ========================================================
# Spring Data JPA & Hibernate Configuration
# ========================================================
# 'update' automatically synchronizes schema changes with entities without dropping existing data
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Open-in-view setting
spring.jpa.open-in-view=true
